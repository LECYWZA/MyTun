name: release

# Builds every platform from source on a clean runner and publishes a GitHub
# Release. Push a tag (v1.2.3) or run the workflow manually to produce a build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install UPX
        run: |
          curl -sSL -o /tmp/upx.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xf /tmp/upx.tar.xz -C /tmp
          sudo install -m755 /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/upx
          upx --version | head -1

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ndk: $ANDROID_HOME/ndk/26.3.11579264"

      - name: Build desktop binaries (packed with UPX)
        run: bash scripts/build-release.sh

      - name: Build Android APK
        env:
          MYTUN_UPX_ANDROID: '0'
        run: bash scripts/build-apk.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist/mytun-linux-amd64 dist/mytun-linux-arm64 dist/mytun-windows-amd64.exe dist/mytun-darwin-arm64 dist/mytun-android.apk out/
          ( cd out && sha256sum * > SHA256SUMS )
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: MyTun ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: out/*
